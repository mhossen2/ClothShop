      content="Get in touch with Apparel Co. for styling inquiries, fittings, and store support."
    />

    <!-- Canonical Tag -->
    <link rel="canonical" href="https://apparelco.com/contact.html" />

    <title>Contact Us | Apparel Co.</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header>
      <div class="container navbar">
        <a href="index.html" class="logo">Apparel Co.</a>
        <div class="menu-toggle" id="mobile-menu">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </div>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="services.html" class="nav-link">Services</a></li>

          <li><a href="contact.html" class="nav-link active">Contact</a></li>
        </ul>
      </div>
    </header>

    <main class="container page-section">
      <h2 class="section-title">Get in Touch</h2>
      <form class="contact-form" id="contact-form">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" required />
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn">Send Message</button>
      </form>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2026 Apparel Co. All rights reserved.</p>
      </div>
    </footer>

    <script src="css/js/main.js"></script>
